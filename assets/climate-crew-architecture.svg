<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Climate Crew Research Platform architecture</title><desc id="desc">A prototype research platform flow from environmental questions through specialist agents, data adapters, research orchestration and debate, into reports and human review; persistent evidence-graph behavior is not asserted beyond the repository's documented scope.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102827"/><stop offset="1" stop-color="#1b6b73"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#9cf0c6"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#9cf0c6}.t{font:700 32px Segoe UI,Arial;fill:#f1fff7}.s{font:400 15px Segoe UI,Arial;fill:#d2f2e2}.n{fill:#1e5154;stroke:#4a9b8d;stroke-width:2}.g{fill:#25777a;stroke:#9cf0c6;stroke-width:2}.y{fill:#3d5550;stroke:#f3c276;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#d3eee0}.q{font:400 12px Segoe UI,Arial;fill:#b9d9cb}.r{stroke:#9cf0c6;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">CLIMATE CREW � PROTOTYPE SOURCE MAP</text><text x="64" y="106" class="t">Independent research roles with explicit review boundaries</text><text x="64" y="136" class="s">Source-backed from main.py, src/, models/, data/, frontend/, eval/, and test/; no persistent scientific-validation claim added here.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Research question</text><text x="195" y="290" text-anchor="middle" class="b">climate / Earth-system scope</text><text x="195" y="318" text-anchor="middle" class="q">project framing</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Specialist agents</text><text x="555" y="290" text-anchor="middle" class="b">independent investigation</text><text x="555" y="318" text-anchor="middle" class="q">literature � datasets � geospatial</text><path d="M680 285H790" class="r"/><rect x="790" y="220" width="250" height="130" rx="16" class="g"/><text x="915" y="260" text-anchor="middle" class="l">Data adapters</text><text x="915" y="290" text-anchor="middle" class="b">sources + models</text><text x="915" y="318" text-anchor="middle" class="q">FastAPI / React prototype surfaces</text><path d="M1040 285H1150" class="r"/><rect x="1150" y="220" width="280" height="130" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Debate + reports</text><text x="1290" y="290" text-anchor="middle" class="b">challenge � alternatives</text><text x="1290" y="318" text-anchor="middle" class="q">human / expert review</text><rect x="500" y="520" width="640" height="92" rx="16" class="n"/><text x="820" y="557" text-anchor="middle" class="l">Evidence boundary</text><text x="820" y="584" text-anchor="middle" class="q">agent consensus is not evidence; validate integrations and scientific workflows</text></svg>

